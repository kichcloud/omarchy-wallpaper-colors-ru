[main]
term=xterm-256color
font=Adwaita Mono:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
# Собственная альфа нужна Hyprland для блюра: он размывает фон только под
# поверхностями с alpha < 1. Композиторская прозрачностьTerminal-правила
# выставлена в 1, чтобы итоговая прозрачность фона оставалась 0.85.
alpha=0.85
